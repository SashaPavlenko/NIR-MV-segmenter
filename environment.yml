# Python environment of the thesis experiments (Linux, NVIDIA GPU, CUDA 11.1 build of PyTorch).
#     conda env create -f environment.yml          (scripts/setup.sh does this)
name: hoist
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - git
  - pip:
      - -f https://download.pytorch.org/whl/torch_stable.html
      - torch==1.9.0+cu111
      - torchvision==0.10.0+cu111
      - -f https://dl.fbaipublicfiles.com/detectron2/wheels/cu111/torch1.9/index.html
      - detectron2==0.6
      - numpy==1.24.4
      - scipy==1.10.1
      - opencv-python-headless==4.13.0.92
      - pycocotools==2.0.7
      - timm==0.6.13
      - shapely==2.0.7
      - h5py==3.11.0
      - scikit-image==0.21.0
      - submitit==1.5.4
      - cython==3.2.4
      - fvcore==0.1.5.post20221221
      - iopath==0.1.9
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - matplotlib==3.7.5
      - pillow==9.5.0
      - tqdm==4.67.3
      - ninja==1.11.1.1
      - gdown==5.2.0
      - setuptools==59.5.0
