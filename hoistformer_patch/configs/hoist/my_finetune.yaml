_BASE_: hoistformer.yaml
MODEL:
  WEIGHTS: "./pretrained_models/trained_model.pth"
  SEM_SEG_HEAD:
    NUM_CLASSES: 8
DATASETS:
  TRAIN: ("hoist_finetune_train",)
  TEST: ("hoist_finetune_holdout",)
SOLVER:
  IMS_PER_BATCH: 1
  BASE_LR: 0.00001
  STEPS: ()
  MAX_ITER: 500
  WARMUP_ITERS: 10
  CHECKPOINT_PERIOD: 100
  AMP:
    ENABLED: true
TEST:
  EVAL_PERIOD: 0
DATALOADER:
  NUM_WORKERS: 2
OUTPUT_DIR: './checkpoints/my_finetune/'
